<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://starcat.ink/blog/">
    <title>Article moved · Starcat Blog</title>
</head>
<body>
    <p>This legacy article URL has moved. Open the <a href="./">Starcat Blog</a>.</p>
    <script>
    (function () {
        // Production Nginx performs the authoritative HTTP 301. This fallback
        // keeps local previews and old static mirrors useful without indexing
        // the obsolete query-parameter URL as a second copy.
        var slug = new URLSearchParams(window.location.search).get('slug') || '';
        if (/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)) {
            window.location.replace('./' + slug + '/');
        }
    })();
    </script>
</body>
</html>
